[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtc"
version = "0.1.0"
description = "Distributed trigger counting: LayeredRand, CoinRand, RingRand and derandomization experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
demo = ["streamlit", "plotly"]
dev = ["pytest"]

[project.scripts]
dtc-experiment = "dtc.experiments.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
